<svg xmlns="http://www.w3.org/2000/svg" width="520" height="96" viewBox="0 0 520 96">
  <!-- US Rent Tools — primary horizontal logo, transparent background.
       Mark on the left, wordmark on the right. "US" in Old Glory red, "Rent Tools" in navy.
       Wordmark uses Arial / Helvetica (web-safe system fonts); the site does not need to load a font for it.
       The PNG version (logo-horizontal-1200.png) is the exact rendered form — use it where font rendering may vary. -->
  <g transform="translate(0 8) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="#0a2a5e"/>
    <path d="M13 29 L32 15 L51 29" fill="none" stroke="#b22234" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="19" y="31" width="26" height="21" rx="4" fill="#ffffff"/>
    <rect x="23" y="35" width="18" height="5" rx="1.5" fill="#b22234"/>
    <circle cx="24.5" cy="46" r="2" fill="#0a2a5e"/>
    <circle cx="32" cy="46" r="2" fill="#0a2a5e"/>
    <circle cx="39.5" cy="46" r="2" fill="#0a2a5e"/>
  </g>
  <text x="96" y="62" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5"><tspan fill="#b22234">US</tspan><tspan fill="#0a2a5e"> Rent Tools</tspan></text>
</svg>
