name: Deploy publish zip (top-5 SEO batch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract publish zip over repo contents
        run: |
          unzip -o rent-tools-site-publish-top5-batch.zip
          rm rent-tools-site-publish-top5-batch.zip
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish top-5 SEO batch"
            git push
          fi
