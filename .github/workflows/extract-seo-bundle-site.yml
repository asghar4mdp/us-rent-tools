name: Extract SEO bundle site zip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site zip and publish
        run: |
          set -e
          ZIP=rent-tools-site-publish-seo-bundle.zip
          if [ ! -f "$ZIP" ]; then echo "No zip found ($ZIP), nothing to do."; exit 0; fi
          mkdir -p /tmp/protected
          [ -f robots.txt ] && cp robots.txt /tmp/protected/ || true
          [ -f google61c7f4d1d9549172.html ] && cp google61c7f4d1d9549172.html /tmp/protected/ || true
          [ -f llms.txt ] && cp llms.txt /tmp/protected/ || true
          rm -rf /tmp/site-src
          mkdir -p /tmp/site-src
          unzip -o "$ZIP" -d /tmp/site-src
          rm -rf assets guides pages tools index.html README.md sitemap.xml llms.txt
          cp -a /tmp/site-src/. ./
          [ -f /tmp/protected/robots.txt ] && cp /tmp/protected/robots.txt ./robots.txt || true
          [ -f /tmp/protected/google61c7f4d1d9549172.html ] && cp /tmp/protected/google61c7f4d1d9549172.html ./google61c7f4d1d9549172.html || true
          if [ ! -f llms.txt ] && [ -f /tmp/protected/llms.txt ]; then cp /tmp/protected/llms.txt ./llms.txt; fi
          rm -rf "$ZIP" .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git commit -m "Publish updated site: SEO bundle — 22 internal links, 8 meta rewrites, hub fixes"
          git push
