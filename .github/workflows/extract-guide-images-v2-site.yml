name: Extract guide images v2 site zip
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and replace site
        run: |
          set -e
          ZIP=rent-tools-site-publish-guide-images-v2.zip
          if [ ! -f "$ZIP" ]; then
            echo "No zip to extract."
            exit 0
          fi
          mkdir -p /tmp/site_extract /tmp/protected
          cp -a vercel.json robots.txt google61c7f4d1d9549172.html llms.txt /tmp/protected/ 2>/dev/null || true
          unzip -o "$ZIP" -d /tmp/site_extract
          if [ -f /tmp/site_extract/index.html ]; then
            SRC=/tmp/site_extract
          elif [ -d /tmp/site_extract/rent-tools-site ]; then
            SRC=/tmp/site_extract/rent-tools-site
          else
            SRC=$(find /tmp/site_extract -maxdepth 3 -name index.html | head -n 1 | xargs dirname)
          fi
          echo "Source: $SRC"
          ls "$SRC"
          test -f "$SRC/index.html"
          test -f "$SRC/sitemap.xml"
          rm -rf assets guides pages tools index.html README.md sitemap.xml llms.txt
          cp -a "$SRC"/. ./
          cp -a /tmp/protected/vercel.json /tmp/protected/robots.txt /tmp/protected/google61c7f4d1d9549172.html ./
          if [ ! -f llms.txt ] && [ -f /tmp/protected/llms.txt ]; then
            cp -a /tmp/protected/llms.txt ./
          fi
          rm -rf "$ZIP" .github
          test -f index.html
          test -f sitemap.xml
          test -f google61c7f4d1d9549172.html
          test -f vercel.json
          test -f robots.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish updated site: guide images v2"
          git push
