name: Extract late fee SEO site zip
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and replace site
        run: |
          set -e
          ZIP=rent-tools-site-publish-latefee-seo.zip
          if [ ! -f "$ZIP" ]; then
            echo "No zip to extract."
            exit 0
          fi
          mkdir -p /tmp/site_extract
          unzip -o "$ZIP" -d /tmp/site_extract
          if [ -f /tmp/site_extract/index.html ]; then
            SRC=/tmp/site_extract
          elif [ -d /tmp/site_extract/rent-tools-site ]; then
            SRC=/tmp/site_extract/rent-tools-site
          else
            SRC=$(find /tmp/site_extract -maxdepth 3 -name index.html | head -n 1 | xargs dirname)
          fi
          echo "Source: $SRC"
          ls "$SRC"
          test -f "$SRC/index.html"
          test -f "$SRC/sitemap.xml"
          test -f "$SRC/google61c7f4d1d9549172.html"
          rm -rf assets guides pages tools index.html README.md robots.txt sitemap.xml vercel.json google61c7f4d1d9549172.html llms.txt
          cp -a "$SRC"/.
          rm -rf "$ZIP" .github
          test -f index.html
          test -f sitemap.xml
          test -f google61c7f4d1d9549172.html
          test -f llms.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish updated site: late fee SEO"
          git push
