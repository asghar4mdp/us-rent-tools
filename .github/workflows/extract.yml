name: Extract site zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repo root
        run: |
          set -e
          mkdir -p /tmp/site
          unzip -o rent-tools-site-publish.zip -d /tmp/site
          if [ -f /tmp/site/index.html ]; then
            cp -a /tmp/site/. .
          else
            for d in /tmp/site/*/; do
              if [ -f "$d/index.html" ]; then
                cp -a "$d". .
                break
              fi
            done
          fi
          test -f index.html
          rm -f rent-tools-site-publish.zip
          rm -rf .github
          git config user.name "asghar4mdp"
          git config user.email "asghar4mdp@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract verified US Rent Tools site"
          git push
