name: Extract expanded site
on:
  push:
    branches: [main]
    paths: ['rent-tools-site-publish.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and replace repo contents
        run: |
          set -e
          test -f rent-tools-site-publish.zip
          rm -rf /tmp/site && mkdir -p /tmp/site
          unzip -o rent-tools-site-publish.zip -d /tmp/site
          if [ "$(ls -1 /tmp/site | wc -l)" = "1" ] && [ -d "/tmp/site/$(ls -1 /tmp/site)" ]; then
            SRC="/tmp/site/$(ls -1 /tmp/site)"
          else
            SRC=/tmp/site
          fi
          echo "Source: $SRC"
          ls -R "$SRC" | head -n 200
          test -f "$SRC/index.html"
          find . -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$SRC"/. .
          rm -rf .github
          ls -1
          git add -A
          git -c user.name=asghar4mdp -c user.email=asghar4mdp@gmail.com commit -m "Add 8 rent calculators and 6 clustered guides, 45 pages total"
          git push
